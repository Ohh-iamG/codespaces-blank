    <script>
      // Ignore Vite HMR WebSocket errors in AI Studio preview per platform environment constraints
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const first = args[0];
            const msg = (first instanceof Error ? (first.message || '') : String(first)) + (args[1] ? String(args[1]) : '');
            if (msg.includes('WebSocket closed without opened') || (msg.includes('[vite]') && msg.includes('WebSocket'))) {
              return;
            }
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (e.reason.message?.includes('WebSocket closed without opened') || e.reason.message?.includes('vite-hmr'))) {
            e.preventDefault();
          }
        });
        window.addEventListener('error', function(e) {
          if (e.message?.includes('WebSocket closed without opened') || (e.filename && e.filename.includes('@vite/client'))) {
            e.preventDefault();
          }
        });
      })();
    </script>
